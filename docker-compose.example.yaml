name: vorax-simulator-dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vorax-simulator:local
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      SIGNING_KEY_FILE: /data/signing.key
      DATABASE_URL: postgres://vorax:vorax_local_only@postgres:5432/vorax?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - simulator-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vorax
      POSTGRES_PASSWORD: vorax_local_only
      POSTGRES_DB: vorax
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - content-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorax -d vorax"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  simulator-data:
  content-data:
