[project]
name = "vorax-gym"
version = "0.1.0"
description = "Gymnasium clients for the Vorax Simulator training API"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.3,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]
train = [
  "sb3-contrib>=2.7,<3",
  "torch>=2.8",
  "tensorboard>=2.16",
]

[project.scripts]
vorax-train = "vorax_gym.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vorax_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
